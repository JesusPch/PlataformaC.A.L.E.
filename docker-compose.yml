services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copia .env.example a .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copia .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Copia .env.example a .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Copia .env.example a .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9004}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: "http://${MINIO_ROOT_USER:?Copia .env.example a .env}:${MINIO_ROOT_PASSWORD:?Copia .env.example a .env}@minio:9000"
    command: ["mb", "--ignore-existing", "local/${MINIO_BUCKET:-pdf-registro}"]
    restart: on-failure

volumes:
  postgres_data:
  minio_data:
